experiment:
  name: gatehub_marlin11_eeg_ppg_video_no_text
  seed: 42
  output_dir: results/dual4090_seed42_3way/gatehub_marlin11_eeg_ppg_video_no_text/seed_42
data:
  dataset_name: bci_subjects_ept_v6_aligned11
  input_mode: precomputed_features
  train_manifest: data/processed/bci_subjects_ept_v6_aligned11/manifests/sessions_all.jsonl
  val_manifest: data/processed/bci_subjects_ept_v6_aligned11/manifests/sessions_val.jsonl
  test_manifest: data/processed/bci_subjects_ept_v6_aligned11/manifests/sessions_test.jsonl
  eeg_time_dim: 8
  eeg_spectral_dim: 40
  physiology_dim: 40
  eeg_channels: 8
  eeg_samples_per_step: 128
  hr_channels: 1
  hr_samples_per_step: 16
  video_dim: 384
  audio_dim: 768
  text_dim: 768
  num_classes: 2
  cohort_policy: all_sessions_training
  expected_session_ids:
  - session_002
  - session_003
  - session_004
  - session_006
  - session_008
  - session_009
  - session_010
  - session_012
  - session_015
  - session_017
  - session_018
  excluded_session_ids:
  - session_011
  require_aligned_behavior_modalities: true
model:
  name: gatehub
  hidden_dim: 64
  num_heads: 4
  dropout: 0.2
  cache_lengths:
    time: 32
    spec: 64
    hr: 64
  spectral_n_ffts:
  - 32
  - 64
  - 128
  num_glimpses: 4
  min_read_width: 0.08
  max_read_width: 1.0
  fixed_read_width: 0.25
  adaptive_reader: true
  shared_read_policy: false
  persistent_state: true
  state_update: gated
  write_gate_bias: -1.0
  retention_gate_bias: 2.0
  latest_state_bypass: true
  use_behavior_context: true
  use_video: true
  use_audio: false
  use_text: false
  use_eeg_time: true
  use_eeg_spec: true
  use_hr: true
  gatehub_present_steps: 8
  gatehub_latent_size: 16
  gatehub_history_layers: 2
  gatehub_decoder_layers: 2
loss:
  cls_weight: 1.0
  boundary_weight: 1.0
  offset_weight: 0.5
  smooth_weight: 0.02
  label_smoothing: 0.02
  class_weights:
  - 2.341035120147874
  - 0.635793172690763
  boundary_pos_weight:
  - 16.114864864864863
  - 16.114864864864863
training:
  sequence_protocol: causal_windows
  epochs: 100
  batch_size: 1
  learning_rate: 0.0003
  weight_decay: 0.001
  grad_clip_norm: 1.0
  patience: 15
  num_workers: 0
  device: cuda
  amp: false
  deterministic: true
  deterministic_warn_only: false
  cudnn_deterministic: true
  cudnn_benchmark: false
  allow_tf32: false
  scheduler:
    name: reduce_on_plateau
    mode: min
    factor: 0.5
    patience: 3
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    min_lr: 1.0e-06
    eps: 1.0e-08
  window_size: 128
  window_stride: 32
  window_warmup_steps: 32
  positive_window_oversample: 1
evaluation:
  positive_class: 0
  frame_threshold: 0.5
  boundary_threshold: 0.5
  boundary_tolerance_steps: 1
  event_iou_thresholds:
  - 0.3
  - 0.5
  - 0.7
  early_detection_delays:
  - 0
  - 1
  - 2
  calibrate_frame_threshold: true
  calibration_min_threshold: 0.1
  calibration_max_threshold: 0.9
  calibration_steps: 81
