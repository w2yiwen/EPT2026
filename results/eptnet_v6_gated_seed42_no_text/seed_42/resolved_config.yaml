experiment:
  name: eptnet_v6_gated_seed42_no_text
  seed: 42
  output_dir: results\eptnet_v6_gated_seed42_no_text\seed_42
data:
  dataset_name: bci_subjects_ept_v6_session_registered_no_facial
  input_mode: precomputed_features
  train_manifest: data/processed/bci_subjects_ept_v6_session_registered_no_facial/manifests/sessions_train.jsonl
  val_manifest: data/processed/bci_subjects_ept_v6_session_registered_no_facial/manifests/sessions_val.jsonl
  test_manifest: data/processed/bci_subjects_ept_v6_session_registered_no_facial/manifests/sessions_test.jsonl
  eeg_time_dim: 8
  eeg_spectral_dim: 40
  physiology_dim: 40
  eeg_channels: 8
  eeg_samples_per_step: 128
  hr_channels: 1
  hr_samples_per_step: 16
  video_dim: 3
  audio_dim: 50
  text_dim: 768
  num_classes: 2
model:
  name: eptnet
  hidden_dim: 64
  num_heads: 4
  dropout: 0.2
  cache_lengths:
    time: 32
    spec: 64
    hr: 64
  spectral_n_ffts:
  - 32
  - 64
  - 128
  num_glimpses: 4
  min_read_width: 0.08
  max_read_width: 1.0
  fixed_read_width: 0.25
  adaptive_reader: true
  shared_read_policy: false
  persistent_state: true
  state_update: gated
  write_gate_bias: -1.0
  retention_gate_bias: 2.0
  latest_state_bypass: true
  use_behavior_context: true
  use_video: false
  use_audio: false
  use_text: false
  use_eeg_time: true
  use_eeg_spec: true
  use_hr: true
loss:
  cls_weight: 1.0
  boundary_weight: 1.0
  offset_weight: 0.5
  smooth_weight: 0.02
  label_smoothing: 0.02
  class_weights:
  - 1.9925604463732176
  - 0.6674974039460021
  boundary_pos_weight:
  - 23.348484848484848
  - 23.348484848484848
training:
  sequence_protocol: continuous_session
  epochs: 100
  batch_size: 1
  learning_rate: 0.0003
  weight_decay: 0.001
  grad_clip_norm: 1.0
  patience: 15
  num_workers: 0
  device: cuda:0
  amp: false
  deterministic: true
  deterministic_warn_only: false
  cudnn_deterministic: true
  cudnn_benchmark: false
  allow_tf32: false
  scheduler:
    name: reduce_on_plateau
    mode: min
    factor: 0.5
    patience: 3
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    min_lr: 1.0e-06
    eps: 1.0e-08
evaluation:
  positive_class: 0
  frame_threshold: 0.5
  boundary_threshold: 0.5
  boundary_tolerance_steps: 1
  event_iou_thresholds:
  - 0.3
  - 0.5
  - 0.7
  early_detection_delays:
  - 0
  - 1
  - 2
  calibrate_frame_threshold: true
  calibration_min_threshold: 0.1
  calibration_max_threshold: 0.9
  calibration_steps: 81
