inherits: bci_subjects.yaml

experiment:
  name: eptnet_bci_subjects_29_absolute_time_no_facial_no_text
  output_dir: results/eptnet_bci_subjects_29_absolute_time_no_facial_no_text

data:
  dataset_name: bci_subjects_ept_v5_absolute_time_no_facial
  train_manifest: data/processed/bci_subjects_ept_v5_absolute_time_no_facial/manifests/sessions_train.jsonl
  val_manifest: data/processed/bci_subjects_ept_v5_absolute_time_no_facial/manifests/sessions_val.jsonl
  test_manifest: data/processed/bci_subjects_ept_v5_absolute_time_no_facial/manifests/sessions_test.jsonl

model:
  # Facial CSV files are excluded from both provenance and model tensors.
  use_video: false
  # Raw audio remains provenance-only until a cohort-wide frozen extractor is enabled.
  use_audio: false
  # Hash text is an alignment/context placeholder, not a publication baseline.
  use_text: false
