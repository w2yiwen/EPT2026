inherits: default.yaml

experiment:
  name: eptnet_bci_subjects_no_text
  output_dir: results/eptnet_bci_subjects_no_text

data:
  dataset_name: bci_subjects_ept_v1
  train_manifest: data/processed/bci_subjects_ept_v1/manifests/train.jsonl
  val_manifest: data/processed/bci_subjects_ept_v1/manifests/val.jsonl
  test_manifest: data/processed/bci_subjects_ept_v1/manifests/test.jsonl
  eeg_time_dim: 8
  eeg_spectral_dim: 40
  physiology_dim: 40
  video_dim: 3
  audio_dim: 50
  text_dim: 768

model:
  # Facial-action features are available for 17/18 subjects; the remaining
  # session is represented by an explicit false video modality mask.
  use_video: true
  # Raw audio/video lack a frozen extractor; audio placeholders are masked out.
  use_audio: false
  # Deterministic text hashes are retained for audit but disabled by default.
  use_text: false
