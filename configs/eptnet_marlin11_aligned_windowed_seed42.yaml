inherits: eptnet_marlin11_aligned_seed42.yaml

# Improved optimization protocol: training uses causal windows, while validation
# and test remain unique complete-session timelines.
experiment:
  name: eptnet_marlin11_aligned_windowed_seed42
  output_dir: results/eptnet_marlin11_aligned_windowed_seed42

training:
  sequence_protocol: causal_windows
  batch_size: 1
  window_size: 128
  window_stride: 32
  window_warmup_steps: 32
  # Keep the first formal run prevalence-neutral. Increase only after train/val
  # ablation because class_weights already compensate for imbalance.
  positive_window_oversample: 1
