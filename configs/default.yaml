experiment:
  name: eptnet_continuous_no_text
  seed: 42
  output_dir: results/eptnet_continuous_no_text

data:
  dataset_name: bci_subjects_ept_v6_aligned11
  input_mode: precomputed_features
  train_manifest: data/processed/bci_subjects_ept_v6_aligned11/manifests/sessions_all.jsonl
  val_manifest: data/processed/bci_subjects_ept_v6_aligned11/manifests/sessions_val.jsonl
  test_manifest: data/processed/bci_subjects_ept_v6_aligned11/manifests/sessions_test.jsonl
  eeg_time_dim: 8
  eeg_spectral_dim: 40
  physiology_dim: 40
  # Raw-window fields remain available for a future end-to-end extractor.
  eeg_channels: 8
  eeg_samples_per_step: 128
  hr_channels: 1
  hr_samples_per_step: 16
  video_dim: 384
  audio_dim: 768
  text_dim: 768
  num_classes: 2
  cohort_policy: all_sessions_training
  expected_session_ids:
    - session_002
    - session_003
    - session_004
    - session_006
    - session_008
    - session_009
    - session_010
    - session_012
    - session_015
    - session_017
    - session_018
  excluded_session_ids: [session_011]
  require_aligned_behavior_modalities: true

model:
  name: eptnet
  hidden_dim: 64
  num_heads: 4
  dropout: 0.2
  cache_lengths:
    time: 32
    spec: 64
    hr: 64
  spectral_n_ffts: [32, 64, 128]
  num_glimpses: 4
  min_read_width: 0.08
  max_read_width: 1.0
  fixed_read_width: 0.25
  adaptive_reader: true
  shared_read_policy: false
  persistent_state: true
  # Gated write/retention follows the paper blueprint and limits propagation of
  # noisy local evidence. Set to vanilla only for the corresponding ablation.
  state_update: gated
  write_gate_bias: -1.0
  retention_gate_bias: 2.0
  latest_state_bypass: true
  use_behavior_context: true
  use_video: true
  use_audio: true
  # Disabled in the trusted protocol: current text features lack extractor provenance
  # and exhibit substantial train/test identity overlap. Enable only for audit runs.
  use_text: false
  use_eeg_time: true
  use_eeg_spec: true
  use_hr: true

loss:
  cls_weight: 1.0
  boundary_weight: 1.0
  offset_weight: 0.5
  smooth_weight: 0.02
  label_smoothing: 0.02
  class_weights: auto
  boundary_pos_weight: auto

training:
  # Train, validate, and test on the same de-duplicated chronological unit.
  sequence_protocol: continuous_session
  epochs: 100
  # One complete session per optimization batch; do not batch or shuffle sessions.
  batch_size: 1
  learning_rate: 0.0003
  weight_decay: 0.001
  grad_clip_norm: 1.0
  patience: 15
  num_workers: 0
  device: auto
  amp: false
  deterministic: true
  deterministic_warn_only: false
  cudnn_deterministic: true
  cudnn_benchmark: false
  allow_tf32: false
  scheduler:
    name: reduce_on_plateau
    mode: min
    factor: 0.5
    patience: 3
    threshold: 0.0001
    threshold_mode: rel
    cooldown: 0
    min_lr: 0.000001
    eps: 0.00000001

evaluation:
  # Dataset labels: 0=deception, 1=truth. Event localization targets deception.
  positive_class: 0
  frame_threshold: 0.5
  boundary_threshold: 0.5
  boundary_tolerance_steps: 1
  event_iou_thresholds: [0.3, 0.5, 0.7]
  early_detection_delays: [0, 1, 2]
  calibrate_frame_threshold: true
  calibration_min_threshold: 0.1
  calibration_max_threshold: 0.9
  calibration_steps: 81
