inherits: eptnet_v6_behavior12_seed42.yaml

# Frozen MARLIN-small, WavLM Base+, and MacBERT features for the twelve
# sessions that have paired video, audio, and annotated text.
experiment:
  name: eptnet_v6_marlin12_gated_seed42
  output_dir: results/eptnet_v6_marlin12_gated_seed42

data:
  dataset_name: bci_subjects_ept_v6_marlin_complete12
  train_manifest: data/processed/bci_subjects_ept_v6_marlin_complete12/manifests/sessions_train.jsonl
  val_manifest: data/processed/bci_subjects_ept_v6_marlin_complete12/manifests/sessions_val.jsonl
  test_manifest: data/processed/bci_subjects_ept_v6_marlin_complete12/manifests/sessions_test.jsonl
  video_dim: 384
  audio_dim: 768
  text_dim: 768

model:
  use_behavior_context: true
  use_video: true
  use_audio: true
  use_text: true
  use_eeg_time: true
  use_eeg_spec: true
  use_hr: true
