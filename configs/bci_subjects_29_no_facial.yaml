inherits: bci_subjects.yaml

experiment:
  name: eptnet_bci_subjects_29_no_facial_no_text
  output_dir: results/eptnet_bci_subjects_29_no_facial_no_text

data:
  dataset_name: bci_subjects_ept_v4_no_facial
  train_manifest: data/processed/bci_subjects_ept_v4_no_facial/manifests/sessions_train.jsonl
  val_manifest: data/processed/bci_subjects_ept_v4_no_facial/manifests/sessions_val.jsonl
  test_manifest: data/processed/bci_subjects_ept_v4_no_facial/manifests/sessions_test.jsonl

model:
  # Facial CSV is excluded at preprocessing time; no behavior-video tensor is observed.
  use_video: false
  # Raw audio is retained for provenance but no frozen cohort-wide embedding is used.
  use_audio: false
  # Transcript hash features are preprocessing placeholders, not a publishable baseline.
  use_text: false
