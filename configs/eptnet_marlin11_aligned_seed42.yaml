inherits: eptnet_v6_marlin12_seed42.yaml

# Hardware-neutral training route over the immutable aligned11 artifact. The
# artifact name records that frozen features were originally extracted on a
# 4060; training may run on any validated CUDA device.
experiment:
  name: eptnet_marlin11_aligned_seed42
  output_dir: results/eptnet_marlin11_aligned_seed42

data:
  dataset_name: bci_subjects_ept_v6_marlin4060_aligned11
  train_manifest: data/processed/bci_subjects_ept_v6_marlin4060_aligned11/manifests/sessions_train.jsonl
  val_manifest: data/processed/bci_subjects_ept_v6_marlin4060_aligned11/manifests/sessions_val.jsonl
  test_manifest: data/processed/bci_subjects_ept_v6_marlin4060_aligned11/manifests/sessions_test.jsonl
  video_dim: 384
  audio_dim: 768
  text_dim: 768
  expected_session_ids:
    - session_002
    - session_003
    - session_004
    - session_006
    - session_008
    - session_009
    - session_010
    - session_012
    - session_015
    - session_017
    - session_018
  excluded_session_ids:
    - session_011
  require_aligned_behavior_modalities: true
