inherits: default.yaml

# Hardware-neutral training route over the immutable aligned11 artifact.
experiment:
  name: eptnet_marlin11_aligned_seed42
  output_dir: results/eptnet_marlin11_aligned_seed42

data:
  dataset_name: bci_subjects_ept_v6_aligned11
  # User-selected protocol: every aligned session participates in training.
  # Validation/test manifests remain fixed evaluation views, not held-out cohorts.
  cohort_policy: all_sessions_training
  train_manifest: data/processed/bci_subjects_ept_v6_aligned11/manifests/sessions_all.jsonl
  val_manifest: data/processed/bci_subjects_ept_v6_aligned11/manifests/sessions_val.jsonl
  test_manifest: data/processed/bci_subjects_ept_v6_aligned11/manifests/sessions_test.jsonl
  video_dim: 384
  audio_dim: 768
  text_dim: 768
  expected_session_ids:
    - session_002
    - session_003
    - session_004
    - session_006
    - session_008
    - session_009
    - session_010
    - session_012
    - session_015
    - session_017
    - session_018
  excluded_session_ids:
    - session_011
  require_aligned_behavior_modalities: true

model:
  use_behavior_context: true
  use_video: true
  use_audio: true
  use_text: true
  use_eeg_time: true
  use_eeg_spec: true
  use_hr: true
