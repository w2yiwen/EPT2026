inherits: eptnet_marlin11_eeg_ppg_video.yaml

experiment:
  name: testra_marlin11_eeg_ppg_video_no_text
  output_dir: results/testra_marlin11_eeg_ppg_video_no_text

model:
  name: testra
  # THUMOS TeSTra uses an eight-frame work memory and alpha=0.97.
  lstr_work_steps: 8
  lstr_long_queries: [16, 32]
  lstr_encoder_layers: [1, 2]
  lstr_decoder_layers: 2
  testra_decay: 0.97
