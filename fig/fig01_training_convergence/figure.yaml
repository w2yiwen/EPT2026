version: 1
figure_id: fig01_training_convergence
purpose: Show optimization convergence for EPT-Net and compare validation localization convergence against LSTR, GateHUB, and TeSTra.
expression: One full-width figure with two side-by-side line-chart panels.
arrangement: row_training; panel (a) loss convergence, panel (b) validation performance.
data:
  sources:
    - path: results/dual4090_seed42_3way/eptnet_marlin11_eeg_ppg_video_no_text/seed_*/history.json
      role: ours_loss_history
    - path: results/dual4090_seed42_3way/{lstr,gatehub,testra,eptnet}_marlin11_eeg_ppg_video_no_text/seed_*/validation_epoch_metrics.jsonl
      role: validation_metric_history
  fields:
    - epoch
    - train.total
    - val.total
    - event.event_ap_iou_0.5
  filters:
    - validation split only for performance curves
    - identical matched seed set across all four models
    - identical measured AP evaluation epochs across all four models and seeds
  grouping: [model, seed, epoch]
  aggregation: Epoch-wise arithmetic mean across matched seeds; loss curves use the common completed-epoch prefix.
  uncertainty: Sample standard deviation across seeds (ddof=1); omitted when only one seed is present.
  statistical_notes: No smoothing, interpolation, test metrics, or imputed evaluations. Each seed's checkpoint is the first epoch attaining its minimum validation total loss.
layout:
  units: mm
  width: 190
  height: 90
  size_source: layout_default_full_width
  dpi: 500
style:
  font_library: ResearchPilot-Skills/research[fig]/font-library.yaml
  color_library: ResearchPilot-Skills/research[fig]/color-library.yaml
  semantic_colors:
    training_loss: blue
    validation_loss: coral
    lstr: slate
    gatehub: teal
    testra: orange
    ours: blue
    selected_checkpoint: charcoal
exceptions: []
