version: 1
table_id: table02_overall_performance
purpose: Compare the actual protocol-matched temporal models and retain mechanism diagnostics without presenting them as main baselines.
title: Performance comparison on the fixed test evaluation view.
data:
  sources:
    - path: results/dual4090_seed42_3way/*/seed_*/test_metrics.json
      role: measured_test_metrics
  metrics:
    - frame.auprc
    - event.event_ap_iou_0.3
    - event.event_ap_iou_0.5
    - event.event_ap_iou_0.7
    - event.event_f1_iou_0.5
  groups:
    main_comparison: [LSTR, GateHUB, TeSTra, EPT-Net (ours)]
    mechanism_diagnostics: [Fixed reader, No persistent state]
  aggregation: Arithmetic mean across seeds; sample standard deviation (ddof=1) only when at least two seeds are available.
  statistical_notes: Current campaign has one run (seed 42), so the generated table reports point estimates without a plus/minus term. Values are displayed as percentages.
claim_limits:
  - Validation and test manifests are fixed training-included evaluation views, not held-out splits.
  - Best values are emphasized only within the four-model main comparison.
  - Diagnostic variants are not hidden when they outperform the full model.
