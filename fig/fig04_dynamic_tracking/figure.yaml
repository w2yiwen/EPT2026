version: 1
figure_id: fig04_dynamic_tracking
purpose: Show that the model produces a continuous target-event probability trace, causal localized intervals, boundary evidence, and modality-specific temporal reads on one predeclared fixed-evaluation sequence.
expression: Four aligned temporal panels (intervals, event probability, boundary probabilities, reader centers with width ribbons).
arrangement: row_3 full width
data:
  sources:
    - path: CLI --predictions; evaluate.py *_predictions.jsonl
      role: per_step_predictions
    - path: CLI --events; evaluate.py *_events.json
      role: decoded_and_target_events
    - path: CLI --metrics; evaluate.py test_metrics.json
      role: validation_selected_threshold_and_protocol
  fields:
    - sample_id
    - target_valid
    - positive_class
    - positive_probability
    - boundary_probabilities
    - read_centers
    - read_widths
    - start_time_seconds
    - end_time_seconds
    - predictions[].start/end
    - targets[].start/end
    - calibration.frame_threshold
  filters:
    - one sample_id declared before inspecting the rendered figure
    - target-valid steps for model evidence
  grouping: [sample_id, chronological step]
  aggregation: none
  uncertainty: none
  statistical_notes: The threshold must come from validation calibration or be supplied explicitly; test labels never select it. Reader centers and widths are normalized cache coordinates in [0,1].
layout: {units: mm, width: 190, height: 120, size_source: layout_default, dpi: 500}
style:
  font_library: ResearchPilot-Skills/research[fig]/font-library.yaml
  color_library: ResearchPilot-Skills/research[fig]/color-library.yaml
  semantic_colors:
    event_probability: blue_dark
    ground_truth: coral
    prediction: blue
    start_boundary: teal
    end_boundary: orange
    eeg_time: blue
    eeg_spectrum: purple
    ppg: teal
exceptions: []
