[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eptnet"
version = "0.1.0"
description = "Event-guided Persistent Temporal Network"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "scipy>=1.12,<2",
  "tqdm>=4.66,<5",
  "matplotlib>=3.8,<3.9",
  "torch>=2.3,<3",
]

[project.scripts]
ept = "eptnet.cli.main:main"

[project.optional-dependencies]
paper = [
  "neurokit2==0.2.11",
  "marlin-pytorch>=0.3,<0.4",
  "speechbrain>=1.0,<1.1",
  "transformers>=4.50,<5",
  "torchaudio>=2.3,<3",
  "torchvision>=0.18,<1",
  "huggingface-hub>=0.25,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
