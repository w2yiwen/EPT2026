name: ci

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2" -e ".[dev]"
      - name: Validate package and public entry point
        run: |
          python -m compileall -q src scripts
          ept --help
          ept doctor --config configs/experiments/aligned11_eptnet.yaml
      - name: Run contract tests
        run: python -m pytest -q
